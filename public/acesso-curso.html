<title>Entrando no curso…</title>
<!-- Sem pixel, sem script de fora: o link traz o token de login do aluno e ele não pode sair daqui pra Meta/OpenAI. -->
<script>
// O e-mail manda: /acesso-curso.html?u={{membership_contact.login_url}}
// O login_url entra logado na raiz da comunidade (que abre o grupo do HTC). Aqui o token vai direto pra página do curso.
(function () {
  var CURSO = "https://comunidade.htclube.com/courses/products/4b45f2de-a534-4344-b3e3-2a4b572827d2";
  var q = location.search.slice(1), u = "", i = q.indexOf("u=");
  if (i >= 0) { u = q.slice(i + 2); try { u = decodeURIComponent(u); } catch (e) {} }
  var m = u.match(/[?&]token=([^&#\s]+)/);
  location.replace(m ? CURSO + "?token=" + m[1] : CURSO);
})();
</script>

</body>
